# ┌──────────────────────────────────────────────────────────────┐
# │                       Radio · messages                       │
# │       Built by Sasha Wildfang for Fractal Network.           │
# └──────────────────────────────────────────────────────────────┘
#
#  Text uses MiniMessage: https://docs.advntr.dev/minimessage/format
#  Leave a chat message empty ("") to turn it off.
#
#  Theme tags work everywhere in this file:
#    <primary> <secondary> <accent> <muted> <good> <bad>
#    <brand>text</brand>   - the theme gradient
#    <prefix>              - the prefix below
#
#  Placeholders like <title> are filled in by the plugin. Each message
#  lists the ones it supports.
#
#  Resource packs can turn symbols into images (servers often map
#  characters like ♫ to menu art). If a symbol shows up as a picture,
#  that symbol is used by your pack: replace it here.

# Do not change. When a plugin update ships new text, your old file is
# saved as messages.yml.old and replaced.
messages-version: 2

theme:
  primary: "#B266FF"
  secondary: "#E3C4FF"
  accent: "#FF7BE5"
  muted: "#9C8DB8"
  good: "#9BFFC4"
  bad: "#FF7590"
  gradient: ["#8E2DE2", "#E58BFF"]

prefix: "<brand><bold>Radio</bold></brand> <dark_gray>»</dark_gray> "

format:
  "on": "<good>on"
  "off": "<bad>off"
  # Progress bars in the GUI and boss/action bar.
  progress-filled: "<primary>▰"
  progress-empty: "<dark_gray>▱"
  progress-length: 14


# ── Chat ────────────────────────────────────────────────────────

general:
  players-only: "<prefix><bad>Only players can do that."
  unknown-command: "<prefix><bad>Unknown command. Try <white>/radio help</white>."
  no-songs: "<prefix><bad>No songs are loaded yet."
  player-not-found: "<prefix><bad><white><name></white> isn't online."   # <name>
  world-disabled: "<prefix><muted>The radio is off in this world."
  help-header: "<brand><bold>Radio</bold></brand> <muted>v<version> · by Sasha Wildfang for Fractal Network"   # <version>
  help-line: " <primary>/<command><secondary><usage></secondary> <dark_gray>- <muted><description>"   # <command> <usage> <description>

# Descriptions shown by /radio help.
help:
  menu: "Open the radio"
  play: "Play a song, or resume"
  pause: "Pause your radio"
  resume: "Resume your radio"
  skip: "Skip to the next song"
  previous: "Go back a song"
  next: "Show what plays next"
  nowplaying: "Show the current song"
  queue: "Show Up next, add a song, or clear it"
  favorite: "Favorite the current song"
  search: "Search songs in the menu"
  shuffle: "Toggle shuffle"
  repeat: "Toggle repeating the song"
  volume: "Show or set your volume"
  bar: "Change the now-playing bar"
  station: "Tune in to the lobby station"
  listenwith: "Listen along with a player"
  stoplistening: "Go back to your own radio"
  reload: "Reload config, messages and songs"
  download: "Sync songs with the repository"

playback:
  # <title> <artist> <length> <category>
  now-playing: "<prefix><muted>Now playing <brand><title></brand> <muted>by <secondary><artist>"
  paused: "<prefix><secondary>Paused. <muted>Use <primary>/resume</primary> to carry on."
  resumed: "<prefix><secondary>Resumed."
  already-paused: "<prefix><muted>Your radio is already paused."
  already-playing: "<prefix><muted>Your radio is already playing."
  nothing-playing: "<prefix><bad>Nothing is playing."
  shuffle: "<prefix><secondary>Shuffle is now <state>."   # <state>
  repeat: "<prefix><secondary>Repeat is now <state>."     # <state>
  volume-current: "<prefix><secondary>Your volume is <primary><volume>%</primary>."   # <volume>
  volume-set: "<prefix><secondary>Volume set to <primary><volume>%</primary>."        # <volume>
  volume-invalid: "<prefix><bad>Volume must be a number from 0 to 100."
  up-next: "<prefix><muted>Up next: <secondary><title></secondary> by <artist>"   # <title> <artist>
  song-not-found: "<prefix><bad>No song matches <white><query></white>."          # <query>
  song-ambiguous: "<prefix><bad><count> songs match: <white><songs></white>. Be more specific."   # <count> <songs>
  usage-toggle: "<prefix><bad>Usage: <white>/<command> [on|off]"   # <command>
  # /songinfo. <title> <artist> <category> <elapsed> <length> <bar> <state>
  info:
    - "<prefix><brand><title></brand> <muted>by <secondary><artist></secondary> <dark_gray>· <muted><category>"
    - "<prefix><bar> <muted><elapsed> / <length> <state>"
  info-paused: "<bad>(paused)"
  info-listening: "<prefix><muted>You're listening with <secondary><name></secondary>."   # <name>

queue:
  added: "<prefix><secondary>Added <primary><title></primary> to Up next <muted>(#<position>)."   # <title> <position>
  full: "<prefix><bad>Up next is full (<limit> songs)."   # <limit>
  removed: "<prefix><secondary>Removed <primary><title></primary> from Up next."   # <title>
  cleared: "<prefix><secondary>Cleared Up next."
  empty: "<prefix><muted>Up next is empty. Right-click a song in <primary>/radio</primary> to add one."
  header: "<prefix><secondary>Up next <muted>(<count>)</muted>:"   # <count>
  line: " <muted><position>. <secondary><title></secondary> <dark_gray>- <muted><artist>"   # <position> <title> <artist>

favorites:
  added: "<prefix><secondary>Added <primary><title></primary> to your favorites <accent>★"   # <title>
  removed: "<prefix><secondary>Removed <primary><title></primary> from your favorites."   # <title>

listen:
  started: "<prefix><secondary>Now listening with <primary><name></primary>. <muted>/stoplistening to leave"   # <name>
  joined-their-host: "<prefix><secondary><target> is listening with <primary><name></primary>, so you joined them too."   # <target> <name>
  notify-host: "<prefix><primary><name></primary> <secondary>is now listening with you."   # <name>
  already: "<prefix><muted>You're already listening with <name>."   # <name>
  self: "<prefix><bad>You can't listen with yourself."
  has-listeners: "<prefix><bad>Others are listening with you, so you can't listen with someone else."
  stopped: "<prefix><secondary>Back on your own radio."
  notify-host-stopped: "<prefix><muted><name> stopped listening with you."   # <name>
  host-left: "<prefix><muted><name> left, so you're back on your own radio."   # <name>
  not-listening: "<prefix><bad>You're not listening with anyone."
  blocked: "<prefix><bad>You're listening with <name>. <muted>Use <primary>/stoplistening</primary> first."   # <name>

station:
  # Shown wherever the station is named.
  name: "<brand>Lobby FM</brand>"
  joined: "<prefix><secondary>Tuned in to <name>. <muted>/radio station leave to go back"   # <name>
  left: "<prefix><secondary>Left <name>. Back on your own radio."   # <name>
  disabled: "<prefix><bad>The lobby station is turned off."
  skipped: "<prefix><secondary>Skipped the station to the next song."

search:
  prompt: "<prefix><secondary>Type a song or artist in chat. <muted>Type <primary>cancel</primary> to go back."
  cancelled: "<prefix><muted>Search cancelled."
  timed-out: "<prefix><muted>Search timed out."

bar:
  changed: "<prefix><secondary>Now-playing bar: <primary><mode></primary>."   # <mode>
  modes:
    bossbar: "boss bar"
    actionbar: "action bar"
    "off": "off"
  # Placeholders: <title> <artist> <elapsed> <length> <bar> <source>
  # <source> is empty on your own radio, or the station/player name when listening along.
  # Boss bar text. The bar itself already shows how far the song is, so no time here.
  boss-playing: "<secondary><title></secondary> <muted>· <artist><source>"
  boss-paused: "<muted>⏸ <title> <dark_gray>|</dark_gray> <muted>paused<source>"
  # Action bar text (it has no bar, so it shows the time).
  playing: "<secondary><title></secondary> <muted>· <artist> <dark_gray>|</dark_gray> <muted><elapsed> / <length></muted><source>"
  paused: "<muted>⏸ <title> <dark_gray>|</dark_gray> <muted>paused<source>"
  source: " <dark_gray>|</dark_gray> <primary><name>"   # <name>

admin:
  reloaded: "<prefix><good>Reloaded the config, messages and <white><count></white> songs."   # <count>
  download-started: "<prefix><secondary>Checking the song repository…"
  download-finished: "<prefix><good>Songs up to date. <muted><new> new, <updated> updated, <removed> removed, <failed> failed, <total> in the repository."   # <new> <updated> <removed> <failed> <total>
  download-failed: "<prefix><bad>Couldn't download songs: <white><error>"   # <error>
  download-disabled: "<prefix><bad>Downloads are turned off in config.yml."


# ── GUI ─────────────────────────────────────────────────────────
# Item names are single lines; lore entries are lists. A lore line that
# only holds a placeholder disappears when that placeholder is empty.
#
# Every item follows the same layout: what it is, its current state, a
# blank line, then its controls. Controls all start with "▸" and name
# the exact click, so they read the same everywhere.

gui:
  # <view> is one of the view names below.
  title: "<brand><bold>Radio</bold></brand> <dark_gray>· <view>"
  views:
    all: "All songs"
    favorites: "Favorites"
    category: "<category>"
    search: "\"<query>\""
    queue: "Up next"
    categories: "Genres"

  sort-modes:
    NAME_AZ: "Title, A to Z"
    NAME_ZA: "Title, Z to A"
    ARTIST_AZ: "Artist, A to Z"
    ARTIST_ZA: "Artist, Z to A"
    SHORTEST: "Shortest first"
    LONGEST: "Longest first"

  # ── Songs ──

  # A song in the list. <title> <artist> <length> <category> <badges>
  # "lore-favorite" is used instead when the song is one of the player's favorites.
  song:
    name: "<secondary><title>"
    lore:
      - "<muted>by <white><artist>"
      - "<muted><length> · <category>"
      - "<badges>"
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to play now"
      - "<dark_gray>▸ <accent>Right-click</accent> <muted>to play it next"
      - "<dark_gray>▸ <accent>Shift + Left-click</accent> <muted>to add to favorites"
    lore-favorite:
      - "<muted>by <white><artist>"
      - "<muted><length> · <category>"
      - "<badges>"
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to play now"
      - "<dark_gray>▸ <accent>Right-click</accent> <muted>to play it next"
      - "<dark_gray>▸ <accent>Shift + Left-click</accent> <muted>to remove from favorites"
    badge-playing: "<good>▶ Playing now"
    badge-favorite: "<accent>★ Favorite"
    badge-queued: "<primary>#<position> in Up next"   # <position>

  # A song in the "Up next" list. Same placeholders plus <position>.
  queued-song:
    name: "<muted>#<position> <secondary><title>"
    lore:
      - "<muted>by <white><artist>"
      - "<muted><length> · <category>"
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to remove from Up next"

  # The disc at the top. <title> <artist> <category> <elapsed> <length> <bar> <next> <source>
  now-playing:
    name: "<brand><title></brand>"
    lore:
      - "<muted>by <white><artist>"
      - "<source>"
      - ""
      - "<bar>"
      - "<white><elapsed> <muted>of <length>"
      - ""
      - "<muted>Up next: <white><next>"
      - ""
      - "<dark_gray>▸ <accent>Shift + Left-click</accent> <muted>to favorite this song"
    source: "<muted>Listening with <primary><name>"   # <name>
  nothing-playing:
    name: "<muted>Nothing playing"
    lore:
      - "<muted>Your radio is quiet."
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>any song below to start"

  empty:
    name: "<muted>No songs here"
    lore:
      - "<muted>Nothing matches what you picked."
      - "<muted>Try another genre, or clear your search."

  # ── Top row ──

  categories:
    name: "<primary>Genres"
    lore:
      - "<muted>Browse songs by genre."
      - "<muted>Showing: <white><view>"
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to pick a genre"
  # A genre in the genre list. <category> <count>
  category:
    name: "<secondary><category>"
    lore:
      - "<muted><count> songs"
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to browse"
  all-songs:
    name: "<secondary>All songs"
    lore:
      - "<muted>Every song, <count> in total."
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to browse"
  favorites:
    name: "<accent>★ Favorites"
    lore:
      - "<muted>The songs you starred."
      - "<muted>You have <white><count></white> favorites."
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to show only favorites"
      - "<dark_gray>▸ <muted>Star a song with <accent>Shift + Left-click"
  search:
    name: "<primary>Search"
    lore:
      - "<muted>Find a song by title or artist."
      - "<query>"
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to type a search in chat"
      - "<dark_gray>▸ <accent>Right-click</accent> <muted>to clear the search"
    current: "<muted>Searching for: <white>\"<query>\""   # <query>
  queue:
    name: "<primary>Up next <muted>(<count>)"
    lore:
      - "<muted>Songs you picked to play next,"
      - "<muted>before your radio carries on."
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to see the list"
      - "<dark_gray>▸ <muted>Add songs with <accent>Right-click"
  queue-back:
    name: "<primary>Back to songs"
    lore:
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to go back"
      - "<dark_gray>▸ <accent>Right-click</accent> <muted>to clear Up next"
  # The lobby station. <name> <title> <listeners>
  station:
    name: "<name>"
    lore:
      - "<muted>A shared radio for the whole lobby."
      - "<muted>Everyone tuned in hears the same song."
      - ""
      - "<muted>Playing: <white><title>"
      - "<muted>Listening: <white><listeners>"
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to tune in"
    lore-listening:
      - "<good>You're tuned in."
      - ""
      - "<muted>Playing: <white><title>"
      - "<muted>Listening: <white><listeners>"
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to go back to your own radio"
  sort:
    name: "<primary>Sort: <white><mode>"   # <mode>
    lore:
      - "<muted>The order songs are listed in."
      - ""
      - "<options>"
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>for the next order"
    option: "<dark_gray>  <muted><mode>"
    option-selected: "<accent>» <white><mode>"

  # ── Bottom row ──

  volume:
    name: "<primary>Volume: <white><volume>%"   # <volume> <bar>
    lore:
      - "<bar>"
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>for +10"
      - "<dark_gray>▸ <accent>Right-click</accent> <muted>for -10"
      - "<dark_gray>▸ <accent>Shift + Left-click</accent> <muted>for +1"
      - "<dark_gray>▸ <accent>Shift + Right-click</accent> <muted>for -1"
  shuffle:
    name: "<primary>Shuffle: <state>"   # <state>
    lore:
      - "<muted>Plays songs in a random order."
      - "<muted>Every song plays once before any repeat."
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to turn on or off"
  previous:
    name: "<primary>⏮ Previous"
    lore:
      - "<muted>Starts the song over. If it only"
      - "<muted>just started, goes back a song."
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to go back"
  play:
    name: "<good>▶ Play"
    lore:
      - "<muted>Your radio is paused."
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to play"
  pause:
    name: "<primary>⏸ Pause"
    lore:
      - "<muted>Your radio is playing."
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to pause"
  skip:
    name: "<primary>Skip ⏭"
    lore:
      - "<muted>Jumps to the next song."
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to skip"
  repeat:
    name: "<primary>Repeat: <state>"   # <state>
    lore:
      - "<muted>Plays the same song again"
      - "<muted>each time it ends."
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to turn on or off"
  bar:
    name: "<primary>Song display: <white><mode>"   # <mode>
    lore:
      - "<muted>Shows the song and its progress"
      - "<muted>while it plays: boss bar,"
      - "<muted>action bar, or off."
      - ""
      - "<dark_gray>▸ <accent>Left-click</accent> <muted>to switch"
  page-back:
    name: "<primary>« Previous page"   # <page> <pages>
    lore:
      - "<muted>Page <white><page></white> of <pages>"
  page-next:
    name: "<primary>Next page »"   # <page> <pages>
    lore:
      - "<muted>Page <white><page></white> of <pages>"
  listening-blocked: "<prefix><bad>You're listening with <name>. Leave first to control your own radio."   # <name>
